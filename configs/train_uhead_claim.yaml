hydra:
  run:
    dir: ${output_dir}/${now:%Y-%m-%d}/${now:%H-%M-%S}

model:
  pretrained_model_name_or_path: Qwen/Qwen3-1.7B
  device_map: cuda
  trust_remote_code: true
  torch_dtype: torch.float16
ue_layer:
  path: ''
  pos_weight: 3
  output_attention: true
  head_cfg:
    head_type: claim
    feature_extractor:
    - name: luh.feature_extractors.basic_attention
      layer_nums: all
      attn_history_sz: 5
      pool: false
    - name: luh.feature_extractors.token_probabilities
      top_n: 4
    uncertainty_head:
      head_dim: 768
      n_layers: 2
      n_heads: 8
      dropout: 0.1
      mask_future_tokens: true
dataset:
  path: hf:rediska0123/train_gsm8k_Qwen3-1.7B
  prompt_path: configs/qwen3_prompt.txt
  num_instances: 0
  test_size: 0.1
  validation: test
training_arguments:
  num_train_epochs: 10
  learning_rate: 0.0001
  warmup_ratio: 0.05
  weight_decay: 0.1
  gradient_accumulation_steps: 16
  per_device_train_batch_size: 1
  max_grad_norm: 1.0
  eval_strategy: epoch
  save_total_limit: 1
do_train: true
do_eval: false
do_hyperopt: false
do_save_checkpoints: false
do_save_final_model: true
report_to: wandb
output_dir: ./workdir/train
do_predict: false
deepspeed_config: null
local_rank: null

# ------------------------------------------------------------------
# FSDP settings (PyTorch ≥ 2.1, HF Transformers ≥ 4.40)
# ------------------------------------------------------------------
fsdp_config:
  fsdp_sharding_strategy: FULL_SHARD          # match the "full_shard" arg
  fsdp_min_num_params: 10000                  # wrap layers >10 k params
  fsdp_offload_params: false                  # put params on CPU? (false = keep on GPU)
  fsdp_state_dict_type: "full_state_dict"     # easier saving/loading
  fsdp_sync_module_states: true               # sync on rank-0 before training
  fsdp_use_orig_params: true                  # keeps param shapes intact
  fsdp_transformer_layer_cls_to_wrap: "LlamaDecoderLayer"  # auto-wrap policy
