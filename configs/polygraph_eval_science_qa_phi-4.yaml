hydra:
  run:
    dir: ${cache_path}/${task}/${model.path}/${dataset}/${now:%Y-%m-%d}/${now:%H-%M-%S}

model:
  type: CausalLM
  path_to_load_script: ./load_qwen.py
  path: microsoft/phi-4
  load_model_args:
    device_map: auto
  load_tokenizer_args: {}

task: bio
dataset: ['TBD']
text_column: question
label_column: answer
eval_split: train
load_from_disk: false
subsample_eval_dataset: -1
use_claim_ue: true

generation_metrics: [{
  'name': 'StepFactCheck',
  'kwargs': {
    'prompt_file': 'configs/phi4_prompt_general.txt',
    'model': 'deepseek-reasoner',
    'n_threads': 16,
    'progress_bar': false,
    'label_type': 'correctness',
    'cache_path': '/cluster/project/sachan/njingwei/uncertainty4reasoning/eval_phi4_sci_qa_cache',
  }
}]

estimators:
  - name: RandomBaselineClaim
  - name: MaximumClaimProbability
#  - name: ClaimConditionedProbabilityClaim  # quite computationally intensive
#    cfg:
#      nli_context: "fact_pref"
  - name: MaxTokenEntropyClaim
  - name: PerplexityClaim
  - name: luh.builder_LuhClaimEstimatorDummy

stat_calculators:
  - auto
  - name: ClaimExtractor
    builder: synthetic_dataset_generation.utils.steps_extractor
    cfg:
      skip_starts: ["Reasoning Steps:", "<start", "<end"]
    stats:
      - "claims"
      - "claim_texts_concatenated"
      - "claim_input_texts_concatenated"
    dependencies:
      - "greedy_texts"
      - "greedy_tokens"
  - name: Luh
    builder: luh.builder_CalculatorInferLuh
    cfg:
      predict_token_uncertainties: false
      uq_head_path: "to_be_filled"
      args_generate:
        max_new_tokens: 512
        min_new_tokens: 2
        temperature: 1.0
        do_sample: true
        top_p: 0.95
        top_k: 50
        repetition_penalty: 1.
        diversity_penalty: 0.
        length_penalty: 1.
        stop_strings: ["<|im_end|>", "<|endoftext|>"]
        #stop_strings: ["\n\n", "}\n"]

      generations_cache_dir: ""
    dependencies:
    stats:
      - "input_texts"
      - "input_tokens"
      - "hidden_states"
      - "greedy_log_probs"
      - "greedy_logits"
      - "greedy_tokens"
      - "greedy_texts"
      - "greedy_log_likelihoods"
      - "greedy_tokens_alternatives"
      - "uhead_features"
  - name: luh_claim
    builder: luh.builder_CalculatorApplyUQHead
    cfg:
    dependencies:
      - "claims"
      - "uhead_features"
    stats:
      - "uncertainty_claim_logits"

max_new_tokens: 512
ignore_exceptions: false
language: en
batch_size: 1
deberta_batch_size: 100
seed:
    - 1
cache_path: ./workdir/cache
save_path: '${hydra:run.dir}'
report_to_wandb: false

n_threads: 16
log_time: true
